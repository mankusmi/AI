[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-profiler"
version = "0.1.0"
description = "Profiling and best-practice analysis for Power BI / Analysis Services semantic models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
live = ["requests>=2.28", "msal>=1.24"]
sharepoint = ["openpyxl>=3.1", "requests>=2.28", "msal>=1.24"]
dev = ["pytest>=7.0", "openpyxl>=3.1", "requests>=2.28", "msal>=1.24"]

[project.scripts]
pbi-profile = "pbi_profiler.cli:main"
sp-profile = "sp_profiler.cli:main"

[tool.setuptools.packages.find]
include = ["pbi_profiler*", "sp_profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
